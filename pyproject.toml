[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "fpz-31at-bridge"
version = "0.1.0"
description = "G-code to FPZ-31AT USB bridge foundation for open-source CAM workflows"
readme = "README.en.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "Meta-Develop"}]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering",
]

[project.optional-dependencies]
test = ["pyserial>=3.5,<4"]
usb = ["pyusb>=1.2,<2"]

[project.urls]
Repository = "https://github.com/Meta-Develop/fpz-31at-bridge"
Issues = "https://github.com/Meta-Develop/fpz-31at-bridge/issues"

[project.scripts]
fpz-31at-bridge = "fpz_candle.__main__:main"
fpz-candle = "fpz_candle.__main__:main"

[tool.setuptools]
packages = ["fpz_candle"]
